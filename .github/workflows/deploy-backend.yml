name: Deploy Backend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  ACR_NAME: acrlinkmed
  ACR_LOGIN_SERVER: acrlinkmed.azurecr.io
  IMAGE_REPOSITORY: linkmed-backend
  RESOURCE_GROUP: rg-linkmed
  APP_NAME: app-linkmed-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:main

          docker build -f DrugsApp.Host/Dockerfile -t $IMAGE .
          docker push $IMAGE

      - name: Deploy image to App Service
        run: |
          IMAGE=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:main

          az webapp config container set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }} \
            --container-image-name $IMAGE \
            --container-registry-url https://${{ env.ACR_LOGIN_SERVER }}

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }}
